name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Run on PR events, or when someone comments /review
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/review'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install agent
        run: pip install -e ".[dev]"

      - name: Install linters
        run: pip install ruff

      - name: Determine PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run review
        env:
          CRA_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRA_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          PR_URL="https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.number }}"
          code-review-agent review "$PR_URL"
