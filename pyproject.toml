[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-review-agent"
version = "0.1.0"
description = "AI-powered code review agent for GitHub pull requests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "openai>=1.30,<2",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "click>=8.1,<9",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "rich>=13.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "respx>=0.21,<1",
    "ruff>=0.4,<1",
    "coverage>=7.0,<8",
]
server = [
    "flask>=3.0,<4",
]

[project.scripts]
code-review-agent = "code_review_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
