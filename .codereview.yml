ai:
  provider: openai
  model: gpt-4o
  temperature: 0.1

focus_areas:
  - correctness
  - security
  - performance
  - style

ignore_paths:
  - "*.lock"
  - "vendor/**"
  - "generated/**"
  - "node_modules/**"

linters:
  python:
    enabled: true
    tool: ruff
  java:
    enabled: true
    tool: checkstyle
  go:
    enabled: true
    tool: golangci-lint
  rust:
    enabled: true
    tool: clippy

severity_threshold: suggestion
max_comments: 25
